appId: co.dexlogistics.admin
productName: DEX Admin Console
files:
  - '**/*'
  - '!README.md'
  - '!work/**'
icon: assets/dex-logo.ico
win:
  target:
    - target: nsis
      arch:
        - x64
  signExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DEX Admin Console
  installerIcon: assets/dex-logo.ico
  uninstallerIcon: assets/dex-logo.ico
  artifactName: DEX-Admin-Console-Setup-${version}-x64.exe
